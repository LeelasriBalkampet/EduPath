<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>EduPath</title>
  <script>
    // Simple redirect for Single Page Applications
    // This allows deep linking to work by redirecting to index.html
    location.replace('/' + (location.pathname !== '/' ? '#' + location.pathname : ''));
  </script>
</head>

<body></body>

</html>
